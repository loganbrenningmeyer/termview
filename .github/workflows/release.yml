name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            binary: termview
          - os: macos-14
            platform: macos-arm64
            binary: termview
          - os: windows-2022
            platform: windows-x86_64
            binary: termview.exe

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Test
        run: cargo +stable test --locked

      - name: Build
        run: cargo +stable build --release --locked --bin termview

      - name: Package
        env:
          PLATFORM: ${{ matrix.platform }}
          BINARY: ${{ matrix.binary }}
        run: |
          mkdir -p dist
          tar -czf "dist/termview-${PLATFORM}.tar.gz" \
            -C target/release "$BINARY"

      - uses: actions/upload-artifact@v4
        with:
          name: termview-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: termview-*
          merge-multiple: true
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "termview $TAG" \
            --generate-notes
